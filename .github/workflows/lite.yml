name: Radikall Lite
on:
  push:
    paths: ['lite/**', '.github/workflows/lite.yml']
  pull_request:
    paths: ['lite/**', '.github/workflows/lite.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: lite/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm test
